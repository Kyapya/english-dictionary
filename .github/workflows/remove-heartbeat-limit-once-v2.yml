name: Remove heartbeat limit once v2

on:
  push:
    branches:
      - fix/remove-heartbeat-limit-20260903

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-heartbeat-limit-20260903
          fetch-depth: 0

      - name: Patch heartbeat timeout semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def exact(path, old, new, count=1):
              text = read(path)
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old!r}")
              write(path, text.replace(old, new))

          def at_least_one(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"{path}: no match: {old!r}")
              write(path, text.replace(old, new))

          guard = "scripts/entry_workflow_guard.py"
          text = read(guard)
          if text.count('        "max_heartbeat_gap_minutes": 10,\n') != 2:
              raise SystemExit("unexpected heartbeat profile limit count")
          text = text.replace('        "max_heartbeat_gap_minutes": 10,\n', '')
          start = text.index('def enforce_budget(')
          end = text.index('\ndef clear_review_ingest_failures', start)
          section = text[start:end]
          heartbeat_line = '    heartbeat = _parse_time(manifest.get("last_heartbeat_at"), "last_heartbeat_at", errors)\n'
          if section.count(heartbeat_line) != 1:
              raise SystemExit("enforce_budget heartbeat parse shape changed")
          section = section.replace(heartbeat_line, '')
          exact_assert = '    assert deadline and pre_draft_deadline and heartbeat\n'
          if section.count(exact_assert) != 1:
              raise SystemExit("enforce_budget assert shape changed")
          section = section.replace(exact_assert, '    assert deadline and pre_draft_deadline\n')
          gap_block = (
              '    max_gap = manifest["limits"]["max_heartbeat_gap_minutes"]\n'
              '    if current - heartbeat > timedelta(minutes=max_gap):\n'
              '        _stop(manifest, reason="heartbeat gap budget exhausted", now=current)\n'
              '        return False\n'
          )
          if section.count(gap_block) != 1:
              raise SystemExit("heartbeat gap enforcement block shape changed")
          section = section.replace(gap_block, '')
          text = text[:start] + section + text[end:]
          old_doc = (
              '    The heartbeat is deliberately not refreshed: a failed ingestion is not\n'
              '    progress, so elapsed time and the heartbeat gap keep running against the\n'
              '    run. Returns False once the run is stopped, either because a budget is\n'
              '    exhausted or because the same stage failed MAX_REVIEW_INGEST_FAILURES times.\n'
          )
          new_doc = (
              '    The heartbeat is deliberately not refreshed because a failed ingestion is\n'
              '    not progress. Heartbeat timestamps remain audit metadata only and do not\n'
              '    impose a liveness timeout. Returns False once the run is stopped, either\n'
              '    because a budget is exhausted or because the same stage failed\n'
              '    MAX_REVIEW_INGEST_FAILURES times.\n'
          )
          if text.count(old_doc) != 1:
              raise SystemExit("review ingestion heartbeat docstring shape changed")
          text = text.replace(old_doc, new_doc)
          write(guard, text)

          test_guard = "tests/test_entry_workflow_guard.py"
          exact(
              test_guard,
              '    def test_missing_heartbeat_stops_run(self) -> None:\n'
              '        value = manifest()\n'
              '        confirm_without_git(value)\n'
              '        self.assertFalse(enforce_budget(value, now=START + timedelta(minutes=12)))\n'
              '        self.assertEqual(value["status"], "budget_exhausted")\n'
              '        self.assertEqual(value["stop_reason"], "heartbeat gap budget exhausted")\n',
              '    def test_missing_heartbeat_does_not_stop_run(self) -> None:\n'
              '        value = manifest()\n'
              '        confirm_without_git(value)\n'
              '        self.assertTrue(enforce_budget(value, now=START + timedelta(minutes=12)))\n'
              '        self.assertEqual(value["status"], "in_progress")\n'
              '        self.assertEqual(value["stop_reason"], "")\n'
              '        self.assertNotIn("max_heartbeat_gap_minutes", value["limits"])\n',
          )

          post = "tests/test_post_draft_runtime_budget.py"
          exact(
              post,
              '    def test_stale_post_draft_run_still_stops_on_heartbeat(self) -> None:\n'
              '        value = post_draft_manifest()\n'
              '        limit = PROFILES["extended"]["max_elapsed_minutes"]\n'
              '        heartbeat = START + timedelta(minutes=limit - 1)\n'
              '        value["last_heartbeat_at"] = heartbeat.isoformat().replace("+00:00", "Z")\n\n'
              '        self.assertFalse(\n'
              '            enforce_budget(value, now=START + timedelta(minutes=limit + 11))\n'
              '        )\n'
              '        self.assertEqual(value["status"], "budget_exhausted")\n'
              '        self.assertEqual(value["stop_reason"], "heartbeat gap budget exhausted")\n',
              '    def test_stale_post_draft_run_does_not_stop_on_heartbeat(self) -> None:\n'
              '        value = post_draft_manifest()\n'
              '        limit = PROFILES["extended"]["max_elapsed_minutes"]\n'
              '        heartbeat = START + timedelta(minutes=limit - 1)\n'
              '        value["last_heartbeat_at"] = heartbeat.isoformat().replace("+00:00", "Z")\n\n'
              '        self.assertTrue(\n'
              '            enforce_budget(value, now=START + timedelta(minutes=limit + 11))\n'
              '        )\n'
              '        self.assertEqual(value["status"], "in_progress")\n'
              '        self.assertEqual(value["stop_reason"], "")\n',
          )

          runs_readme = "audits/workflow_runs/README.md"
          exact(
              runs_readme,
              '| profile | 全体時間 | draft保存 | 検索query | 候補page | heartbeat間隔 |\n'
              '|---|---:|---:|---:|---:|---:|\n'
              '| standard | 60分 | 20分 | 12 | 18 | 10分 |\n'
              '| extended | 90分 | 30分 | 18 | 26 | 10分 |\n',
              '| profile | 全体時間 | draft保存 | 検索query | 候補page |\n'
              '|---|---:|---:|---:|---:|\n'
              '| standard | 60分 | 20分 | 12 | 18 |\n'
              '| extended | 90分 | 30分 | 18 | 26 |\n',
          )
          exact(
              runs_readme,
              '外部調査の各batchの前後と、作業中少なくとも10分ごとにheartbeatを実行する。\n',
              'heartbeatは各batchの前後などで進捗時刻を残すために実行できるが、実行間隔に上限はなく、heartbeatが古いことだけを理由にrunを停止しない。\n',
          )

          entry_spec = "prompts/entry_spec_v5.md"
          exact(
              entry_spec,
              '通常はstandard profileを使い、開始から全工程60分、draft保存20分、検索query 12件、候補page 18件、heartbeat間隔10分を上限とする。多義性または専門領域の広さについて具体的理由を記録した場合だけextendedを使え、開始から全工程90分、draft保存30分、検索query 18件、候補page 26件を上限とする。個別上限を引き上げてはならない。\n',
              '通常はstandard profileを使い、開始から全工程60分、draft保存20分、検索query 12件、候補page 18件を上限とする。多義性または専門領域の広さについて具体的理由を記録した場合だけextendedを使え、開始から全工程90分、draft保存30分、検索query 18件、候補page 26件を上限とする。heartbeatは進捗時刻を残す監査情報であり、実行間隔に上限を設けない。個別budget上限を引き上げてはならない。\n',
          )
          exact(
              entry_spec,
              '採用した資料だけでなく、検索を試みるqueryと開く候補pageを、各外部調査batchの前に `entry_workflow_guard.py record-research` で記録する。各batchの前後と、作業中少なくとも10分ごとに `heartbeat` を実行する。終了コード2またはbudget到達時は、同じ依頼内で探索・再生成・新cycleを続けず、存在するdraftを `checked: false` のまま保存し、run JSONの `stop_reason` と `open_questions` をcommit・pushして安全停止する。時間不足を理由に合格基準を緩めてはならない。\n',
              '採用した資料だけでなく、検索を試みるqueryと開く候補pageを、各外部調査batchの前に `entry_workflow_guard.py record-research` で記録する。`heartbeat` は各batchの前後などで進捗時刻を残すために実行できるが、間隔超過を停止条件にしない。終了コード2またはbudget到達時は、同じ依頼内で探索・再生成・新cycleを続けず、存在するdraftを `checked: false` のまま保存し、run JSONの `stop_reason` と `open_questions` をcommit・pushして安全停止する。時間不足を理由に合格基準を緩めてはならない。\n',
          )

          source = "prompts/source_first_audit_v2.md"
          at_least_one(source, '全体時間、検索query、候補page、heartbeat上限', '全体時間、検索query、候補pageの各上限')
          at_least_one(source, '時間・query・候補page・heartbeat budget', '時間・query・候補page budget')
          at_least_one(source, '終了後にheartbeatする。', '終了後にheartbeatで進捗時刻を記録できる（heartbeat間隔に上限はない）。')

          final_spec = "prompts/final_review_spec_v1.md"
          at_least_one(final_spec, '全体時間・検索query・候補page・heartbeat budget', '全体時間・検索query・候補page budget')

          root = "README.md"
          at_least_one(root, '並列サブエージェント実行中もheartbeat・budgetは進行します。', '並列サブエージェント実行中もbudgetは進行します。heartbeatは監査用の進捗時刻であり、間隔超過だけでは停止しません。')
          at_least_one(root, 'heartbeat、budget、remote checkpoint、段階成果物の存在、blind入力分離、seal時系列、status遷移はスクリプトが強制します。', 'budget、remote checkpoint、段階成果物の存在、blind入力分離、seal時系列、status遷移はスクリプトが強制します。heartbeatは監査用の進捗時刻として記録します。')

          for path in [guard, test_guard, post, runs_readme, entry_spec, source, final_spec, root]:
              text = read(path)
              for token in ['"max_heartbeat_gap_minutes"', 'heartbeat gap budget exhausted', 'heartbeat間隔10分', 'heartbeat上限', 'heartbeat budget']:
                  if token in text:
                      raise SystemExit(f"{path}: stale heartbeat-limit contract remains: {token}")
          PY

      - name: Run regression tests
        shell: bash
        run: |
          python tests/test_entry_workflow_guard.py
          python tests/test_post_draft_runtime_budget.py

      - name: Commit patch and remove one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/remove-heartbeat-limit-once.yml .github/workflows/remove-heartbeat-limit-once-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove heartbeat timeout"
          git push origin HEAD:fix/remove-heartbeat-limit-20260903
