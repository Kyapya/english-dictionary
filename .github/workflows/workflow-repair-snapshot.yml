name: Workflow repair verification (temporary)
on:
  push:
    branches: [fix/workflow-contracts-20260924]
permissions:
  contents: read
concurrency:
  group: workflow-contracts-repair-20260924
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'Kyapya/english-dictionary' && github.ref == 'refs/heads/fix/workflow-contracts-20260924' && contains(github.event.head_commit.message, '[apply-workflow-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact reviewed patch and allowed paths
        run: |
          mkdir -p /tmp/workflow-repair-results
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.workflow-repair.{i}.b64').read_text().strip() for i in (1, 2))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          expected = 'd32bdcddb25b559acab370dc5fc9b4a2db69316d7edcebe1bfd8393d5e1f8076'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch hash mismatch; no changes applied')
          path = pathlib.Path('/tmp/workflow-repair.patch')
          path.write_bytes(patch)
          allowed = '''AGENTS.md
          docs/incidents/2026-09-24-suspicion-workflow-contracts.md
          docs/workflow_integrity.md
          prompts/check_pass_evidence_v7.md
          prompts/check_pass_frame_relation_v7.md
          prompts/check_pass_qualification_v6.md
          prompts/check_router_v6.md
          prompts/final_review_spec_v3.md
          scripts/check_passes.py
          scripts/checker_subagent_gate.py
          scripts/generate_audit_manifest.py
          scripts/handoff_provenance.py
          scripts/review_continuation.py
          scripts/review_liveness.py
          scripts/review_preflight.py
          scripts/review_results.py
          scripts/review_validation.py
          scripts/run_word.py
          scripts/run_word_parallel.py
          scripts/run_word_v3.py
          scripts/source_first_audit_gate.py
          scripts/workflow_revision.py
          tests/test_suspicion_workflow_regressions.py'''.splitlines()
          allowed = [p.strip() for p in allowed]
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(path)], text=True)
          actual = [line.split('\t', 2)[2] for line in stats.splitlines()]
          if sorted(actual) != sorted(allowed):
              raise SystemExit('Unexpected patch paths; no changes applied')
          pathlib.Path('/tmp/workflow-repair-allowed.txt').write_text('\n'.join(allowed)+'\n')
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          print('Verified SHA-256:', expected)
          print('Applied only the 23 reviewed infrastructure/documentation/test files')
          PY
      - name: Run complete test suite with historical commits available
        run: |
          set -o pipefail
          git diff --check
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/workflow-repair-results/unit-tests.log
      - name: Validate existing repository contracts
        run: |
          set -o pipefail
          {
            python scripts/check_passes.py validate-router
            python scripts/migration_table.py validate
            python scripts/review_liveness.py regression audits/runs/y/yield/20260826T131200Z-yield02
            python scripts/validate_entry.py entries
            python scripts/queue_status.py escaped-by-stage
            python scripts/validate_repository.py
            python scripts/process_improvement.py validate
            python scripts/checker_subagent_gate.py validate --merge-ready
          } 2>&1 | tee /tmp/workflow-repair-results/contracts.log
      - name: Commit tested infrastructure only to repair branch
        run: |
          python - <<'PY'
          import pathlib, subprocess
          allowed = pathlib.Path('/tmp/workflow-repair-allowed.txt').read_text().splitlines()
          subprocess.run(['git', 'add', '--', *allowed], check=True)
          actual = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          if sorted(actual) != sorted(allowed):
              raise SystemExit('Unexpected staged paths; no commit or push')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align review contracts and resume sealed checker evidence'
          git push origin HEAD:refs/heads/fix/workflow-contracts-20260924
          git rev-parse HEAD | tee /tmp/workflow-repair-results/tested-commit.txt
      - name: Preserve verification logs and historical source
        if: always()
        run: |
          mkdir -p /tmp/workflow-repair-results
          git bundle create /tmp/workflow-repair-results/history.bundle --all
          git diff --stat > /tmp/workflow-repair-results/worktree-stat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-repair-verification
          path: /tmp/workflow-repair-results/
          retention-days: 1
