name: Fix heartbeat CI contracts once

on:
  push:
    branches:
      - fix/remove-heartbeat-limit-20260903

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-heartbeat-limit-20260903
          fetch-depth: 0

      - name: Update remaining heartbeat contract tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          prompt_tests = "tests/test_prompt_contracts.py"
          old = '''                self.assertEqual(current, (backup / name).read_text(encoding="utf-8"))
        self.assertEqual(
            (REPO_ROOT / "prompts" / "final_review_spec_v1.md").read_bytes(),
            (backup / "final_review_spec_v1.md").read_bytes(),
        )
'''
          new = '''                expected = (backup / name).read_text(encoding="utf-8")
                if name == "entry_spec_v5.md":
                    expected = expected.replace(
                        "通常はstandard profileを使い、開始から全工程60分、draft保存20分、検索query 12件、候補page 18件、heartbeat間隔10分を上限とする。多義性または専門領域の広さについて具体的理由を記録した場合だけextendedを使え、開始から全工程90分、draft保存30分、検索query 18件、候補page 26件を上限とする。個別上限を引き上げてはならない。",
                        "通常はstandard profileを使い、開始から全工程60分、draft保存20分、検索query 12件、候補page 18件を上限とする。多義性または専門領域の広さについて具体的理由を記録した場合だけextendedを使え、開始から全工程90分、draft保存30分、検索query 18件、候補page 26件を上限とする。heartbeatは進捗時刻を残す監査情報であり、実行間隔に上限を設けない。個別budget上限を引き上げてはならない。",
                    ).replace(
                        "採用した資料だけでなく、検索を試みるqueryと開く候補pageを、各外部調査batchの前に `entry_workflow_guard.py record-research` で記録する。各batchの前後と、作業中少なくとも10分ごとに `heartbeat` を実行する。終了コード2またはbudget到達時は、同じ依頼内で探索・再生成・新cycleを続けず、存在するdraftを `checked: false` のまま保存し、run JSONの `stop_reason` と `open_questions` をcommit・pushして安全停止する。時間不足を理由に合格基準を緩めてはならない。",
                        "採用した資料だけでなく、検索を試みるqueryと開く候補pageを、各外部調査batchの前に `entry_workflow_guard.py record-research` で記録する。`heartbeat` は各batchの前後などで進捗時刻を残すために実行できるが、間隔超過を停止条件にしない。終了コード2またはbudget到達時は、同じ依頼内で探索・再生成・新cycleを続けず、存在するdraftを `checked: false` のまま保存し、run JSONの `stop_reason` と `open_questions` をcommit・pushして安全停止する。時間不足を理由に合格基準を緩めてはならない。",
                    )
                self.assertEqual(current, expected)
        expected_final = (backup / "final_review_spec_v1.md").read_text(encoding="utf-8").replace(
            "全体時間・検索query・候補page・heartbeat budget",
            "全体時間・検索query・候補page budget",
        )
        self.assertEqual(
            (REPO_ROOT / "prompts" / "final_review_spec_v1.md").read_text(encoding="utf-8"),
            expected_final,
        )
'''
          replace_exact(prompt_tests, old, new)

          run_word_tests = "tests/test_run_word.py"
          old = '''    def test_heartbeat_stops_instead_of_extending_budget(self) -> None:
        started = datetime(2026, 8, 25, tzinfo=timezone.utc)
        manifest = guard.new_manifest(
            headword="obvious",
            entry_path="entries/o/obvious.md",
            branch="word/obvious",
            base_sha="a" * 40,
            now=started,
        )
        deadline = manifest["deadline_at"]
        self.assertFalse(
            run_word.heartbeat_manifest(
                manifest, now=started + timedelta(minutes=11)
            )
        )
        self.assertEqual(manifest["status"], "budget_exhausted")
        self.assertEqual(manifest["deadline_at"], deadline)
'''
          new = '''    def test_heartbeat_records_progress_without_extending_budget(self) -> None:
        started = datetime(2026, 8, 25, tzinfo=timezone.utc)
        manifest = guard.new_manifest(
            headword="obvious",
            entry_path="entries/o/obvious.md",
            branch="word/obvious",
            base_sha="a" * 40,
            now=started,
        )
        deadline = manifest["deadline_at"]
        heartbeat_at = started + timedelta(minutes=11)
        self.assertTrue(run_word.heartbeat_manifest(manifest, now=heartbeat_at))
        self.assertEqual(manifest["status"], "in_progress")
        self.assertEqual(
            manifest["last_heartbeat_at"],
            heartbeat_at.isoformat().replace("+00:00", "Z"),
        )
        self.assertEqual(manifest["deadline_at"], deadline)
'''
          replace_exact(run_word_tests, old, new)
          PY

      - name: Run full unit suite
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-heartbeat-ci-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: update heartbeat contracts"
          git push origin HEAD:fix/remove-heartbeat-limit-20260903
