# Temporary branch-only implementation helper; removed before the PR is merged.
name: Apply and test lightweight workflow
on:
  push:
    branches: [refactor/lightweight-entry-workflow-20261003]
    paths: [.github/workflows/refactor-workspace.yml, .github/refactor-recipe.py.gz]
permissions:
  contents: write
jobs:
  apply-and-test:
    if: github.ref == 'refs/heads/refactor/lightweight-entry-workflow-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply locally tested refactor to the isolated branch
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, os, subprocess, sys
          data = Path('.github/refactor-recipe.py.gz').read_bytes()
          # Correct the known one-character transport insertion, then verify
          # the complete payload before decoding or executing anything.
          encoded = base64.b64encode(data).decode('ascii')
          encoded = encoded.replace('Mc3LVYPgggU1', 'Mc3LVYPggU1', 1)
          data = base64.b64decode(encoded + '===')
          expected = 'ab3075f93813b09302a751e541225e9953665649817094b9445199df33143045'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Refactor transfer checksum mismatch')
          script = Path(os.environ['RUNNER_TEMP']) / 'apply-lightweight-workflow.py'
          script.write_bytes(gzip.decompress(data))
          subprocess.run([sys.executable, str(script)], check=True)
          PY
      - name: Compile and run all regression tests with full Git history
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          python scripts/validate_entry.py entries
          python scripts/validate_repository.py
          git diff --check
      - name: Commit only implementation and instructions after successful tests
        shell: bash
        run: |
          git diff --exit-code -- entries queue audits backups process_improvement exports
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git add AGENTS.md README.md docs prompts scripts tests
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor: separate writing from independent content review'
          git push origin "HEAD:$GITHUB_REF_NAME"
