name: Apply reviewer agent independence patch

on:
  push:
    branches:
      - fix/reviewer-agent-independence-20260830

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # run_word.py: same model is allowed only when a distinct reviewer agent is declared.
          replace_once(
              "scripts/run_word.py",
              '''def ingest_handoff_review(\n    manifest: dict[str, Any],\n    *,\n    stage: str,\n    declared_model: str,\n    repo_root: Path = REPO_ROOT,\n) -> Path:\n''',
              '''def ingest_handoff_review(\n    manifest: dict[str, Any],\n    *,\n    stage: str,\n    declared_model: str,\n    reviewer_agent_id: str | None = None,\n    repo_root: Path = REPO_ROOT,\n) -> Path:\n''',
          )
          replace_once(
              "scripts/run_word.py",
              '''    reviewer = {\n        "mode": "handoff",\n        "declared_model": declared_model.strip(),\n        "ingested_by": "human",\n    }\n    entry = repo_root / str(manifest["entry_path"])\n    front, _ = validate_entry._split_front_matter(entry.read_text(encoding="utf-8"))\n    generation_model = validate_entry._front_matter_values(front or []).get("model", "")\n    if review_liveness.normalize_text(declared_model) == review_liveness.normalize_text(\n        generation_model\n    ):\n        raise ValueError("handoff review model must differ from the generation model")\n    value["reviewer"] = reviewer\n''',
              '''    agent_id = (reviewer_agent_id or "").strip()\n    reviewer = {\n        "mode": "handoff",\n        "declared_model": declared_model.strip(),\n        "ingested_by": "human",\n    }\n    if agent_id:\n        reviewer["agent_id"] = agent_id\n    entry = repo_root / str(manifest["entry_path"])\n    front, _ = validate_entry._split_front_matter(entry.read_text(encoding="utf-8"))\n    generation_model = validate_entry._front_matter_values(front or []).get("model", "")\n    same_model = review_liveness.normalize_text(declared_model) == review_liveness.normalize_text(\n        generation_model\n    )\n    if same_model:\n        if not agent_id:\n            raise ValueError(\n                "same-model handoff review requires reviewer_agent_id to prove independent-agent provenance"\n            )\n        reviewer["same_model_as_generation"] = True\n    value["reviewer"] = reviewer\n''',
          )

          p = Path("scripts/run_word.py")
          text = p.read_text(encoding="utf-8")
          needle = '    parser.add_argument("--declared-model")\n'
          if text.count(needle) != 1:
              raise SystemExit("run_word.py: --declared-model parser anchor not unique")
          text = text.replace(
              needle,
              needle + '    parser.add_argument("--reviewer-agent-id")\n',
              1,
          )
          text, count = re.subn(
              r'(declared_model=args\.declared_model,\n)(\s+repo_root=REPO_ROOT,)',
              r'\1                reviewer_agent_id=args.reviewer_agent_id,\n\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("run_word.py: ingest CLI call anchor not found")
          p.write_text(text, encoding="utf-8")

          # review_liveness.py: compare independent agent identities, not model names.
          replace_once(
              "scripts/review_liveness.py",
              '''def reviewer_model(value: Any) -> str | None:\n    if not isinstance(value, dict):\n        return None\n    raw = value.get("model") if value.get("mode") == "api" else value.get("declared_model")\n    return normalize_text(raw) or None\n''',
              '''def reviewer_model(value: Any) -> str | None:\n    if not isinstance(value, dict):\n        return None\n    raw = value.get("model") if value.get("mode") == "api" else value.get("declared_model")\n    return normalize_text(raw) or None\n\n\ndef reviewer_agent_id(value: Any) -> str | None:\n    """Return the independent reviewer-agent identity with legacy fallback."""\n    if not isinstance(value, dict):\n        return None\n    explicit = normalize_text(value.get("agent_id"))\n    if explicit:\n        return explicit\n    if value.get("mode") == "api":\n        response_id = normalize_text(value.get("response_id"))\n        provider = normalize_text(value.get("provider"))\n        if response_id:\n            return f"api:{provider}:{response_id}"\n    # Historical handoff records did not carry agent_id. Preserve their\n    # previous model-based distinction rather than invalidating old audits.\n    return reviewer_model(value)\n''',
          )

          p = Path("scripts/review_liveness.py")
          text = p.read_text(encoding="utf-8")
          anchor = '    model = reviewer_model(value)\n'
          if text.count(anchor) != 1:
              raise SystemExit("review_liveness.py: reviewer validation anchor not unique")
          text = text.replace(
              anchor,
              '''    agent_id = value.get("agent_id")\n    if agent_id is not None and (not isinstance(agent_id, str) or not agent_id.strip()):\n        errors.append("reviewer.agent_id must be a non-empty string when supplied")\n\n''' + anchor,
              1,
          )
          old = '''    primary_models = {\n        reviewer_model(cold_review.get("reviewer")),\n        *(\n            reviewer_model(item.get("reviewer"))\n            for item in pass_findings.get("pass_outputs", [])\n            if isinstance(item, dict) and item.get("pass_id") == "example-attribution"\n        ),\n    } - {None}\n    secondary_models = {\n        reviewer_model(cold_secondary.get("reviewer")),\n        reviewer_model(attr_secondary.get("reviewer")),\n    } - {None}\n    if not secondary_models or primary_models & secondary_models:\n        return [\n            f"{B4_ZERO_FINDING_SINGLE_REVIEW}: second reviews must declare a model "\n            "different from the primary reviewers"\n        ]\n'''
          new = '''    primary_agents = {\n        reviewer_agent_id(cold_review.get("reviewer")),\n        *(\n            reviewer_agent_id(item.get("reviewer"))\n            for item in pass_findings.get("pass_outputs", [])\n            if isinstance(item, dict) and item.get("pass_id") == "example-attribution"\n        ),\n    } - {None}\n    secondary_agents = {\n        reviewer_agent_id(cold_secondary.get("reviewer")),\n        reviewer_agent_id(attr_secondary.get("reviewer")),\n    } - {None}\n    if not secondary_agents or primary_agents & secondary_agents:\n        return [\n            f"{B4_ZERO_FINDING_SINGLE_REVIEW}: second reviews must declare an independent "\n            "reviewer agent different from the primary reviewers"\n        ]\n'''
          if text.count(old) != 1:
              raise SystemExit("review_liveness.py: zero-finding model gate anchor not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              'f"{B4_ZERO_FINDING_SINGLE_REVIEW}: a zero-finding run requires second-model "\n            "cold and example-attribution reviews"',
              'f"{B4_ZERO_FINDING_SINGLE_REVIEW}: a zero-finding run requires independent secondary-agent "\n            "cold and example-attribution reviews"',
              1,
          )
          p.write_text(text, encoding="utf-8")

          # API review calls already have a unique response id; persist it as agent provenance.
          replace_once(
              "scripts/review_call.py",
              '''    reviewer: dict[str, Any] = {\n        "mode": "api",\n        "provider": provider,\n        "model": model,\n        "response_id": response_id,\n        "request_sha256": canonical_sha256(request_payload),\n    }\n''',
              '''    reviewer: dict[str, Any] = {\n        "mode": "api",\n        "provider": provider,\n        "model": model,\n        "response_id": response_id,\n        "request_sha256": canonical_sha256(request_payload),\n        "agent_id": f"api:{provider}:{response_id}",\n    }\n''',
          )

          # Existing run_word regression: same model remains rejected without agent provenance,
          # and succeeds when a distinct agent id is explicitly supplied.
          p = Path("tests/test_run_word.py")
          text = p.read_text(encoding="utf-8")
          old = '''            with self.assertRaisesRegex(ValueError, "must differ"):\n                run_word.ingest_handoff_review(\n                    manifest,\n                    stage="checker_passes",\n                    declared_model="synthetic-fixture",\n                    repo_root=root,\n                )\n'''
          new = '''            with self.assertRaisesRegex(ValueError, "reviewer_agent_id"):\n                run_word.ingest_handoff_review(\n                    manifest,\n                    stage="checker_passes",\n                    declared_model="synthetic-fixture",\n                    repo_root=root,\n                )\n            same_model_target = run_word.ingest_handoff_review(\n                manifest,\n                stage="checker_passes",\n                declared_model="synthetic-fixture",\n                reviewer_agent_id="independent-checker-agent",\n                repo_root=root,\n            )\n            same_model_ingested = json.loads(same_model_target.read_text())\n            self.assertEqual(\n                same_model_ingested["reviewer"]["agent_id"],\n                "independent-checker-agent",\n            )\n            self.assertTrue(\n                same_model_ingested["reviewer"]["same_model_as_generation"]\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit("test_run_word.py: same-model regression anchor not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Focused zero-finding regression tests for agent identity semantics.
          Path("tests/test_reviewer_agent_independence.py").write_text(
              '''from __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nREPO_ROOT = Path(__file__).resolve().parents[1]\nSCRIPTS = REPO_ROOT / "scripts"\nif str(SCRIPTS) not in sys.path:\n    sys.path.insert(0, str(SCRIPTS))\n\nimport review_liveness  # noqa: E402\n\n\ndef _reviewer(model: str, agent_id: str) -> dict[str, object]:\n    return {\n        "mode": "handoff",\n        "declared_model": model,\n        "ingested_by": "human",\n        "agent_id": agent_id,\n    }\n\n\ndef _zero_finding_inputs(primary: dict[str, object]):\n    normal = {\n        "pass_outputs": [\n            {\n                "pass_id": "example-attribution",\n                "reviewer": primary,\n                "findings": [],\n            }\n        ]\n    }\n    cold = {"reviewer": primary, "findings": []}\n    blind = {\n        "independent_candidates": [{"disposition": "included"}],\n        "article_findings": [],\n    }\n    return normal, cold, blind\n\n\ndef test_zero_finding_allows_same_model_with_different_agent_ids() -> None:\n    primary = _reviewer("gpt-5.6-sol", "primary-agent")\n    secondary = _reviewer("gpt-5.6-sol", "secondary-agent")\n    normal, cold, blind = _zero_finding_inputs(primary)\n    assert review_liveness.zero_finding_run_errors(\n        normal,\n        cold,\n        blind,\n        secondary_reviews={\n            "cold_review": {"reviewer": secondary, "findings": []},\n            "example_attribution": {"reviewer": secondary, "findings": []},\n        },\n    ) == []\n\n\ndef test_zero_finding_rejects_same_agent_even_when_model_names_differ() -> None:\n    primary = _reviewer("model-a", "same-agent")\n    secondary = _reviewer("model-b", "same-agent")\n    normal, cold, blind = _zero_finding_inputs(primary)\n    errors = review_liveness.zero_finding_run_errors(\n        normal,\n        cold,\n        blind,\n        secondary_reviews={\n            "cold_review": {"reviewer": secondary, "findings": []},\n            "example_attribution": {"reviewer": secondary, "findings": []},\n        },\n    )\n    assert any("independent reviewer agent" in error for error in errors)\n''',
              encoding="utf-8",
          )

          # Documentation: model diversity is optional; agent/context independence is mandatory.
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "独立レビュー段には、レビューAPI用のキーまたは別モデル・別セッションを使うhandoffモードが必要です。",
              "独立レビュー段には、レビューAPI用のキーまたは生成担当とは独立した別エージェント・別セッションを使うhandoffモードが必要です。同じモデルを使っても、独立エージェントとして実行・記録されていれば構いません。",
              1,
          )
          text = text.replace(
              "cold review / final blind のモデルは記事front matterの生成モデルと異なるものを既定とし、同一モデルを明示的に使う場合は出力provenanceへ `same_model_as_generation: true` が付きます。",
              "cold review / final blind は生成担当とは独立したreview agent/contextで実行します。モデル差は必須条件ではありません。同一モデルを使う場合は出力provenanceへ `same_model_as_generation: true` と独立した `agent_id` を記録し、handoffでは `--reviewer-agent-id` を必須にします。APIモードではresponse idからagent provenanceを記録します。",
              1,
          )
          text = text.replace(
              "  --ingest-review <stage> --declared-model <model-name>\n",
              "  --ingest-review <stage> --declared-model <model-name> \\\n  --reviewer-agent-id <independent-agent-id>\n",
              1,
          )
          p.write_text(text, encoding="utf-8")
          PY

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_review_liveness.py \
            tests/test_reviewer_agent_independence.py \
            tests/test_run_word.py \
            tests/test_review_call.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/review_liveness.py scripts/review_call.py scripts/run_word.py tests/test_run_word.py tests/test_reviewer_agent_independence.py
          git commit -m "fix: define review independence by agent context"
          git push origin HEAD
