name: Apply reviewer agent independence patch v3

on:
  push:
    branches:
      - fix/reviewer-agent-independence-20260830

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch script from v2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-reviewer-agent-independence-v2.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          body = workflow[start:end]
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          )
          exec(compile(body, '<reviewer-agent-patch>', 'exec'))
          PY

      - name: Compile and run repository unit tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v

      - name: Assert independent-agent semantics
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          import review_liveness

          def reviewer(model, agent):
              return {
                  'mode': 'handoff',
                  'declared_model': model,
                  'ingested_by': 'human',
                  'agent_id': agent,
              }

          primary = reviewer('gpt-5.6-sol', 'primary-agent')
          secondary = reviewer('gpt-5.6-sol', 'secondary-agent')
          normal = {'pass_outputs': [{'pass_id': 'example-attribution', 'reviewer': primary, 'findings': []}]}
          cold = {'reviewer': primary, 'findings': []}
          blind = {'independent_candidates': [{'disposition': 'included'}], 'article_findings': []}
          errors = review_liveness.zero_finding_run_errors(
              normal,
              cold,
              blind,
              secondary_reviews={
                  'cold_review': {'reviewer': secondary, 'findings': []},
                  'example_attribution': {'reviewer': secondary, 'findings': []},
              },
          )
          assert errors == [], errors

          same_agent = reviewer('different-model', 'primary-agent')
          errors = review_liveness.zero_finding_run_errors(
              normal,
              cold,
              blind,
              secondary_reviews={
                  'cold_review': {'reviewer': same_agent, 'findings': []},
                  'example_attribution': {'reviewer': same_agent, 'findings': []},
              },
          )
          assert any('independent reviewer agent' in error for error in errors), errors
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/review_liveness.py scripts/review_call.py scripts/run_word.py tests/test_run_word.py tests/test_reviewer_agent_independence.py
          git commit -m "fix: define review independence by agent context"
          git push origin HEAD
