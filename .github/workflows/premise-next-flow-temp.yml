name: Premise next flow temp

on:
  push:
    branches:
      - add/premise-v5-20260829
    paths:
      - .github/workflows/premise-next-flow-temp.yml

permissions:
  contents: write

jobs:
  prepare-checker-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add/premise-v5-20260829
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare checker-pass handoff from preserved run
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          repo = Path('.').resolve()
          sys.path.insert(0, str(repo / 'scripts'))
          import run_word

          manifest_path = repo / 'audits/workflow_runs/premise/20260829T084230Z-premise02.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          request = run_word.next_stage_request(manifest)
          if not isinstance(request, dict) or request.get('name') != 'checker_passes':
              raise SystemExit(f'unexpected next stage: {request!r}')
          handoff = run_word.prepare_handoff(manifest, repo_root=repo)
          print(handoff.relative_to(repo))
          PY

      - name: Commit generated handoff and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/runs/p/premise/20260829T084230Z-premise02/check_passes \
                  audits/runs/p/premise/20260829T084230Z-premise02/handoff
          git rm .github/workflows/premise-next-flow-temp.yml
          git commit -m "workflow(premise): prepare independent checker handoff"
          git push origin HEAD:add/premise-v5-20260829
