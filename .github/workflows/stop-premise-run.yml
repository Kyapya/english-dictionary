name: Stop unavailable premise run

on:
  push:
    branches:
      - add/premise-v5-20260829
    paths:
      - .github/workflows/stop-premise-run.yml

permissions:
  contents: write

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout premise branch
        uses: actions/checkout@v4
        with:
          ref: add/premise-v5-20260829
          fetch-depth: 0

      - name: Stop failed reviewer run
        shell: bash
        run: |
          set -euo pipefail
          python scripts/entry_workflow_guard.py stop             audits/workflow_runs/premise/20260830T042940Z-bcfc9d2b.json             --reason "independent reviewer model selection unavailable in Copilot CLI"             --open-question "Use a Copilot CLI model exposed by the current plan, then rerun the guarded review."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/workflow_runs/premise/20260830T042940Z-bcfc9d2b.json
          git commit -m "workflow(premise): stop unavailable reviewer run"
          git push origin HEAD:add/premise-v5-20260829
