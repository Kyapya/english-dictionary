name: Premise independent checker

on:
  push:
    branches:
      - add/premise-v5-20260829
    paths:
      - .github/workflows/premise-independent-checker.yml

permissions:
  contents: write
  copilot-requests: write

jobs:
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout premise branch
        uses: actions/checkout@v4
        with:
          ref: add/premise-v5-20260829
          fetch-depth: 0

      - name: Configure Git and adopt current independence contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge origin/main --no-edit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run independent checker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sed -i 's/MODEL = "claude-haiku-4.5"/MODEL = "auto"/' .github/scripts/premise_independent_checker.py
          python .github/scripts/premise_independent_checker.py
