name: Premise independent checker

on:
  push:
    branches:
      - add/premise-v5-20260829
    paths:
      - .github/workflows/premise-independent-checker.yml

permissions:
  contents: write
  copilot-requests: write

jobs:
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout premise branch
        uses: actions/checkout@v4
        with:
          ref: add/premise-v5-20260829
          fetch-depth: 0

      - name: Configure Git and adopt current independence contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge origin/main --no-edit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run independent checker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/premise_independent_checker.py')
          text = path.read_text(encoding='utf-8')
          old = 'Every row has example_id, classification (unique or ambiguous), candidate_sense_ids (exactly one for unique, at least two for ambiguous), discriminating_terms (non-empty for unique, [] for ambiguous), and rationale. Never use blind_attribution, confidence, discriminative_terms, or alternative_candidates.'
          new = 'Every row has example_id, classification (unique or ambiguous), candidate_sense_ids (exactly one for unique, at least two for ambiguous), discriminating_terms (non-empty for unique, [] for ambiguous), and rationale. LIVENESS GROUNDING IS MANDATORY: for every unique row, each discriminating_terms value must be copied verbatim from that row\'s supplied example or translation, and the rationale must literally repeat at least one such valid discriminating term. For every ambiguous row, discriminating_terms must be [] and the rationale must literally include the complete supplied English example text verbatim. Make each rationale item-specific rather than reusing a template so that the rationales remain substantively distinct. Copy grounding text only from the supplied request; never invent or normalize quotes. Never use blind_attribution, confidence, discriminative_terms, or alternative_candidates.'
          if old not in text:
              raise SystemExit('expected stage1 attribution contract text not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          sed -i 's/MODEL = "claude-haiku-4.5"/MODEL = "auto"/' .github/scripts/premise_independent_checker.py
          mkdir -p audits/debug/premise
          LOG="audits/debug/premise/checker-${GITHUB_RUN_ID}.log"
          set +e
          python .github/scripts/premise_independent_checker.py > "$LOG" 2>&1
          RC=$?
          set -e
          cat "$LOG"
          if [ "$RC" -ne 0 ]; then
            git add "$LOG" audits/workflow_runs/premise audits/runs/p/premise || true
            if ! git diff --cached --quiet; then
              git commit -m "audit(premise): checkpoint independent checker failure"
              git push origin HEAD:add/premise-v5-20260829
            fi
          fi
          exit "$RC"
