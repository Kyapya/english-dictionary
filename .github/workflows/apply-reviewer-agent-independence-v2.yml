name: Apply reviewer agent independence patch v2

on:
  push:
    branches:
      - fix/reviewer-agent-independence-20260830

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # run_word.py: same model is allowed only with explicit independent-agent provenance.
          replace_once(
              "scripts/run_word.py",
              '''def ingest_handoff_review(\n    manifest: dict[str, Any],\n    *,\n    stage: str,\n    declared_model: str,\n    repo_root: Path = REPO_ROOT,\n) -> Path:\n''',
              '''def ingest_handoff_review(\n    manifest: dict[str, Any],\n    *,\n    stage: str,\n    declared_model: str,\n    reviewer_agent_id: str | None = None,\n    repo_root: Path = REPO_ROOT,\n) -> Path:\n''',
          )
          replace_once(
              "scripts/run_word.py",
              '''    reviewer = {\n        "mode": "handoff",\n        "declared_model": declared_model.strip(),\n        "ingested_by": "human",\n    }\n    entry = repo_root / str(manifest["entry_path"])\n    front, _ = validate_entry._split_front_matter(entry.read_text(encoding="utf-8"))\n    generation_model = validate_entry._front_matter_values(front or []).get("model", "")\n    if review_liveness.normalize_text(declared_model) == review_liveness.normalize_text(\n        generation_model\n    ):\n        raise ValueError("handoff review model must differ from the generation model")\n    value["reviewer"] = reviewer\n''',
              '''    agent_id = (reviewer_agent_id or "").strip()\n    reviewer = {\n        "mode": "handoff",\n        "declared_model": declared_model.strip(),\n        "ingested_by": "human",\n    }\n    if agent_id:\n        reviewer["agent_id"] = agent_id\n    entry = repo_root / str(manifest["entry_path"])\n    front, _ = validate_entry._split_front_matter(entry.read_text(encoding="utf-8"))\n    generation_model = validate_entry._front_matter_values(front or []).get("model", "")\n    same_model = review_liveness.normalize_text(declared_model) == review_liveness.normalize_text(\n        generation_model\n    )\n    if same_model:\n        if not agent_id:\n            raise ValueError(\n                "same-model handoff review requires reviewer_agent_id to prove independent-agent provenance"\n            )\n        reviewer["same_model_as_generation"] = True\n    value["reviewer"] = reviewer\n''',
          )
          replace_once(
              "scripts/run_word.py",
              '''def _resume(\n    path: Path,\n    *,\n    ingest_review: str | None = None,\n    declared_model: str = "",\n    call_review: bool = False,\n) -> int:\n''',
              '''def _resume(\n    path: Path,\n    *,\n    ingest_review: str | None = None,\n    declared_model: str = "",\n    reviewer_agent_id: str = "",\n    call_review: bool = False,\n) -> int:\n''',
          )
          replace_once(
              "scripts/run_word.py",
              '''            ingested_path = ingest_handoff_review(\n                manifest,\n                stage=ingest_review,\n                declared_model=declared_model,\n            )\n''',
              '''            ingested_path = ingest_handoff_review(\n                manifest,\n                stage=ingest_review,\n                declared_model=declared_model,\n                reviewer_agent_id=reviewer_agent_id or None,\n            )\n''',
          )
          replace_once(
              "scripts/run_word.py",
              '''    parser.add_argument("--declared-model", default="")\n''',
              '''    parser.add_argument("--declared-model", default="")\n    parser.add_argument("--reviewer-agent-id", default="")\n''',
          )
          replace_once(
              "scripts/run_word.py",
              '''        if args.call_review and args.declared_model:\n            raise SystemExit("--declared-model is only used with --ingest-review")\n        return _resume(\n            args.resume,\n            ingest_review=args.ingest_review,\n            declared_model=args.declared_model,\n            call_review=args.call_review,\n        )\n''',
              '''        if args.call_review and (args.declared_model or args.reviewer_agent_id):\n            raise SystemExit(\n                "--declared-model and --reviewer-agent-id are only used with --ingest-review"\n            )\n        if args.reviewer_agent_id and not args.ingest_review:\n            raise SystemExit("--reviewer-agent-id requires --ingest-review")\n        return _resume(\n            args.resume,\n            ingest_review=args.ingest_review,\n            declared_model=args.declared_model,\n            reviewer_agent_id=args.reviewer_agent_id,\n            call_review=args.call_review,\n        )\n''',
          )
          replace_once(
              "scripts/run_word.py",
              '''    if args.call_review or args.ingest_review or args.declared_model:\n        raise SystemExit(\n            "--call-review, --ingest-review, and --declared-model require --resume"\n        )\n''',
              '''    if (\n        args.call_review\n        or args.ingest_review\n        or args.declared_model\n        or args.reviewer_agent_id\n    ):\n        raise SystemExit(\n            "--call-review, --ingest-review, --declared-model, and --reviewer-agent-id require --resume"\n        )\n''',
          )

          # review_liveness.py: agent identity, not model identity, defines independent review.
          replace_once(
              "scripts/review_liveness.py",
              '''def reviewer_model(value: Any) -> str | None:\n    if not isinstance(value, dict):\n        return None\n    raw = value.get("model") if value.get("mode") == "api" else value.get("declared_model")\n    return normalize_text(raw) or None\n''',
              '''def reviewer_model(value: Any) -> str | None:\n    if not isinstance(value, dict):\n        return None\n    raw = value.get("model") if value.get("mode") == "api" else value.get("declared_model")\n    return normalize_text(raw) or None\n\n\ndef reviewer_agent_id(value: Any) -> str | None:\n    """Return independent reviewer-agent identity with legacy compatibility."""\n    if not isinstance(value, dict):\n        return None\n    explicit = normalize_text(value.get("agent_id"))\n    if explicit:\n        return explicit\n    if value.get("mode") == "api":\n        response_id = normalize_text(value.get("response_id"))\n        provider = normalize_text(value.get("provider"))\n        if response_id:\n            return f"api:{provider}:{response_id}"\n    # Historical handoff records predate agent_id. Keep their former\n    # model-based separation only as a compatibility fallback.\n    return reviewer_model(value)\n''',
          )
          p = Path("scripts/review_liveness.py")
          text = p.read_text(encoding="utf-8")
          anchor = '    model = reviewer_model(value)\n'
          if text.count(anchor) != 1:
              raise SystemExit("review_liveness.py: reviewer validation anchor not unique")
          text = text.replace(
              anchor,
              '''    agent_id = value.get("agent_id")\n    if agent_id is not None and (not isinstance(agent_id, str) or not agent_id.strip()):\n        errors.append("reviewer.agent_id must be a non-empty string when supplied")\n\n''' + anchor,
              1,
          )
          old = '''    primary_models = {\n        reviewer_model(cold_review.get("reviewer")),\n        *(\n            reviewer_model(item.get("reviewer"))\n            for item in pass_findings.get("pass_outputs", [])\n            if isinstance(item, dict) and item.get("pass_id") == "example-attribution"\n        ),\n    } - {None}\n    secondary_models = {\n        reviewer_model(cold_secondary.get("reviewer")),\n        reviewer_model(attr_secondary.get("reviewer")),\n    } - {None}\n    if not secondary_models or primary_models & secondary_models:\n        return [\n            f"{B4_ZERO_FINDING_SINGLE_REVIEW}: second reviews must declare a model "\n            "different from the primary reviewers"\n        ]\n'''
          new = '''    primary_agents = {\n        reviewer_agent_id(cold_review.get("reviewer")),\n        *(\n            reviewer_agent_id(item.get("reviewer"))\n            for item in pass_findings.get("pass_outputs", [])\n            if isinstance(item, dict) and item.get("pass_id") == "example-attribution"\n        ),\n    } - {None}\n    secondary_agents = {\n        reviewer_agent_id(cold_secondary.get("reviewer")),\n        reviewer_agent_id(attr_secondary.get("reviewer")),\n    } - {None}\n    if not secondary_agents or primary_agents & secondary_agents:\n        return [\n            f"{B4_ZERO_FINDING_SINGLE_REVIEW}: second reviews must declare an independent "\n            "reviewer agent different from the primary reviewers"\n        ]\n'''
          if text.count(old) != 1:
              raise SystemExit("review_liveness.py: zero-finding model gate anchor not found")
          text = text.replace(old, new, 1)
          old_message = '''            f"{B4_ZERO_FINDING_SINGLE_REVIEW}: a zero-finding run requires second-model "\n            "cold and example-attribution reviews"\n'''
          new_message = '''            f"{B4_ZERO_FINDING_SINGLE_REVIEW}: a zero-finding run requires independent "\n            "secondary-agent cold and example-attribution reviews"\n'''
          if text.count(old_message) != 1:
              raise SystemExit("review_liveness.py: B4 missing-secondary message anchor not found")
          p.write_text(text.replace(old_message, new_message, 1), encoding="utf-8")

          # API calls have a unique response id; persist it explicitly as agent provenance.
          replace_once(
              "scripts/review_call.py",
              '''    reviewer: dict[str, Any] = {\n        "mode": "api",\n        "provider": provider,\n        "model": model,\n        "response_id": response_id,\n        "request_sha256": canonical_sha256(request_payload),\n    }\n''',
              '''    reviewer: dict[str, Any] = {\n        "mode": "api",\n        "provider": provider,\n        "model": model,\n        "response_id": response_id,\n        "request_sha256": canonical_sha256(request_payload),\n        "agent_id": f"api:{provider}:{response_id}",\n    }\n''',
          )

          # Regression: same model without agent proof fails; same model with distinct agent succeeds.
          replace_once(
              "tests/test_run_word.py",
              '''            with self.assertRaisesRegex(ValueError, "must differ"):\n                run_word.ingest_handoff_review(\n                    manifest,\n                    stage="checker_passes",\n                    declared_model="synthetic-fixture",\n                    repo_root=root,\n                )\n''',
              '''            with self.assertRaisesRegex(ValueError, "reviewer_agent_id"):\n                run_word.ingest_handoff_review(\n                    manifest,\n                    stage="checker_passes",\n                    declared_model="synthetic-fixture",\n                    repo_root=root,\n                )\n            same_model_target = run_word.ingest_handoff_review(\n                manifest,\n                stage="checker_passes",\n                declared_model="synthetic-fixture",\n                reviewer_agent_id="independent-checker-agent",\n                repo_root=root,\n            )\n            same_model_ingested = json.loads(same_model_target.read_text())\n            self.assertEqual(\n                same_model_ingested["reviewer"]["agent_id"],\n                "independent-checker-agent",\n            )\n            self.assertTrue(\n                same_model_ingested["reviewer"]["same_model_as_generation"]\n            )\n''',
          )
          Path("tests/test_reviewer_agent_independence.py").write_text(
              '''from __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nREPO_ROOT = Path(__file__).resolve().parents[1]\nSCRIPTS = REPO_ROOT / "scripts"\nif str(SCRIPTS) not in sys.path:\n    sys.path.insert(0, str(SCRIPTS))\n\nimport review_liveness  # noqa: E402\n\n\ndef _reviewer(model: str, agent_id: str) -> dict[str, object]:\n    return {\n        "mode": "handoff",\n        "declared_model": model,\n        "ingested_by": "human",\n        "agent_id": agent_id,\n    }\n\n\ndef _zero_finding_inputs(primary: dict[str, object]):\n    normal = {\n        "pass_outputs": [\n            {\n                "pass_id": "example-attribution",\n                "reviewer": primary,\n                "findings": [],\n            }\n        ]\n    }\n    cold = {"reviewer": primary, "findings": []}\n    blind = {\n        "independent_candidates": [{"disposition": "included"}],\n        "article_findings": [],\n    }\n    return normal, cold, blind\n\n\ndef test_zero_finding_allows_same_model_with_different_agent_ids() -> None:\n    primary = _reviewer("gpt-5.6-sol", "primary-agent")\n    secondary = _reviewer("gpt-5.6-sol", "secondary-agent")\n    normal, cold, blind = _zero_finding_inputs(primary)\n    assert review_liveness.zero_finding_run_errors(\n        normal,\n        cold,\n        blind,\n        secondary_reviews={\n            "cold_review": {"reviewer": secondary, "findings": []},\n            "example_attribution": {"reviewer": secondary, "findings": []},\n        },\n    ) == []\n\n\ndef test_zero_finding_rejects_same_agent_even_when_models_differ() -> None:\n    primary = _reviewer("model-a", "same-agent")\n    secondary = _reviewer("model-b", "same-agent")\n    normal, cold, blind = _zero_finding_inputs(primary)\n    errors = review_liveness.zero_finding_run_errors(\n        normal,\n        cold,\n        blind,\n        secondary_reviews={\n            "cold_review": {"reviewer": secondary, "findings": []},\n            "example_attribution": {"reviewer": secondary, "findings": []},\n        },\n    )\n    assert any("independent reviewer agent" in error for error in errors)\n''',
              encoding="utf-8",
          )

          # Document the intended invariant.
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          replacements = [
              (
                  "独立レビュー段には、レビューAPI用のキーまたは別モデル・別セッションを使うhandoffモードが必要です。",
                  "独立レビュー段には、レビューAPI用のキーまたは生成担当とは独立した別エージェント・別セッションを使うhandoffモードが必要です。同じモデルを使っても、独立エージェントとして実行・記録されていれば構いません。",
              ),
              (
                  "cold review / final blind のモデルは記事front matterの生成モデルと異なるものを既定とし、同一モデルを明示的に使う場合は出力provenanceへ `same_model_as_generation: true` が付きます。",
                  "cold review / final blind は生成担当とは独立したreview agent/contextで実行します。モデル差は必須条件ではありません。同一モデルを使う場合は出力provenanceへ `same_model_as_generation: true` と独立した `agent_id` を記録し、handoffでは `--reviewer-agent-id` を必須にします。APIモードではresponse idからagent provenanceを記録します。",
              ),
              (
                  "  --ingest-review <stage> --declared-model <model-name>\n",
                  "  --ingest-review <stage> --declared-model <model-name> \\\n  --reviewer-agent-id <independent-agent-id>\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"README.md: expected one anchor: {old[:80]!r}")
              text = text.replace(old, new, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_review_liveness.py \
            tests/test_reviewer_agent_independence.py \
            tests/test_run_word.py \
            tests/test_review_call.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/review_liveness.py scripts/review_call.py scripts/run_word.py tests/test_run_word.py tests/test_reviewer_agent_independence.py
          git commit -m "fix: define review independence by agent context"
          git push origin HEAD
