name: Suspicion review capability probe

on:
  push:
    branches:
      - words/suspicion-20260911

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check independent review API configuration
        shell: bash
        env:
          REVIEW_KEY: ${{ secrets.DICT_REVIEW_API_KEY }}
          REVIEW_MODEL: ${{ secrets.DICT_REVIEW_MODEL }}
        run: |
          test -n "$REVIEW_KEY" || { echo "DICT_REVIEW_API_KEY is not configured"; exit 2; }
          test -n "$REVIEW_MODEL" || { echo "DICT_REVIEW_MODEL is not configured"; exit 3; }
          echo "Independent review API configuration is present."
