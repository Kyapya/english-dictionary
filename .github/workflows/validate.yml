name: Validate dictionary changes

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "entries/**/*.md"
      - "queue/**"
      - "docs/**"
      - "prompts/**"
      - "scripts/**"
      - "tests/**"
      - "audits/**"
      - "process_improvement/**"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "README.md"
      - "requirements.txt"
      - ".gitattributes"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  validate-platforms:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate entry formats
        run: python scripts/validate_entry.py entries

      - name: Validate queue and entry consistency
        run: python scripts/validate_repository.py

      # Content review is performed in a separate context by the operator.
      # CI checks the artifact, not audit receipts, execution IDs or chronology.

  # Preserve the existing required-check name. This is an AND gate over both
  # platforms, not a synthetic success or a branch-protection exception.
  validate:
    name: validate
    needs: validate-platforms
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform validation to succeed
        env:
          RESULT: ${{ needs.validate-platforms.result }}
        run: test "$RESULT" = "success"
