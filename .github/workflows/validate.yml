name: Validate dictionary changes

on:
  pull_request:
    paths:
      - "entries/**/*.md"
      - "audits/**"
      - "queue/words.csv"
      - "prompts/**/*.md"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/validate.yml"
      - "AGENTS.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate entry formats
        run: python scripts/validate_entry.py entries

      - name: Validate queue and entry consistency
        run: python scripts/validate_repository.py

      - name: Validate changed independent content audits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/content_audit.py validate-changed \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"

      - name: Validate all existing content audits
        if: github.event_name != 'pull_request'
        run: python scripts/content_audit.py validate-audited
