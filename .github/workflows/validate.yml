name: Validate dictionary changes

on:
  pull_request:
    paths:
      - "entries/**/*.md"
      - "audits/**"
      - "process_improvement/**"
      - "queue/words.csv"
      - "prompts/**/*.md"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/validate.yml"
      - "AGENTS.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Finalize obvious adjudication and validate final tree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ""
          Path('/tmp/finalize_obvious.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          PYTHONPATH=. python /tmp/finalize_obvious.py

          rm -f .tmp/obvious_generator.b64 .tmp/materialize_obvious_blind.py .tmp/repair_obvious_legal_synonym.py dummy tests/test_obvious_diagnostic.py
          git checkout origin/main -- .github/workflows/validate.yml

          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          python scripts/validate_entry.py entries
          python scripts/validate_repository.py
          python scripts/process_improvement.py validate
          python scripts/entry_workflow_guard.py validate --merge-ready
          python scripts/content_audit.py validate entries/o/obvious.md --audit audits/o/obvious.json
          python scripts/semantic_resolution_gate.py validate-entries entries/o/obvious.md
          python scripts/source_first_audit_gate.py validate-entries entries/o/obvious.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize obvious v5 review"
          FINAL_HEAD=$(git rev-parse HEAD)

          python scripts/entry_workflow_guard.py validate-changed --base "$BASE_SHA" --head "$FINAL_HEAD" --merge-ready
          python scripts/content_audit.py validate-changed --base "$BASE_SHA" --head "$FINAL_HEAD"
          python scripts/semantic_resolution_gate.py validate-changed --base "$BASE_SHA" --head "$FINAL_HEAD"
          python scripts/source_first_audit_gate.py validate-changed --base "$BASE_SHA" --head "$FINAL_HEAD"

          git push origin "HEAD:${{ github.head_ref }}"
