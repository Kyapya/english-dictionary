name: Validate dictionary changes

on:
  pull_request:
    paths:
      - "entries/**/*.md"
      - "audits/**"
      - "process_improvement/**"
      - "queue/words.csv"
      - "prompts/**/*.md"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/validate.yml"
      - "AGENTS.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Pack temporary obvious diagnostic bundle
        run: |
          git bundle create /tmp/obvious-workspace.bundle \
            refs/remotes/origin/main \
            refs/remotes/origin/agent/update-obvious-v5-20260825

      - name: Upload temporary obvious diagnostic bundle
        uses: actions/upload-artifact@v4
        with:
          name: obvious-workspace-diagnostic
          path: /tmp/obvious-workspace.bundle
          retention-days: 1

      - name: Validate entry formats
        run: python scripts/validate_entry.py entries

      - name: Validate queue and entry consistency
        run: python scripts/validate_repository.py

      - name: Validate project improvement knowledge
        run: python scripts/process_improvement.py validate

      - name: Validate bounded entry workflow runs
        if: github.event_name != 'pull_request'
        run: python scripts/entry_workflow_guard.py validate --merge-ready

      - name: Validate changed independent content audits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/entry_workflow_guard.py validate-changed \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --merge-ready
          python scripts/content_audit.py validate-changed \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"
          python scripts/semantic_resolution_gate.py validate-changed \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"
          python scripts/source_first_audit_gate.py validate-changed \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"

      - name: Validate all existing content audits
        if: github.event_name != 'pull_request'
        run: |
          python scripts/content_audit.py validate-audited
          python scripts/semantic_resolution_gate.py validate-audited --compat
