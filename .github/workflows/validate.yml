name: Validate dictionary changes

on:
  pull_request:
    paths:
      - "entries/**/*.md"
      - "audits/**"
      - "process_improvement/**"
      - "queue/words.csv"
      - "prompts/**/*.md"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/validate.yml"
      - "AGENTS.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate entry formats
        run: python scripts/validate_entry.py entries

      - name: Validate v6 checker routing and rule migration
        run: |
          python scripts/check_passes.py validate-router
          python scripts/migration_table.py validate
          python scripts/review_liveness.py regression \
            audits/runs/y/yield/20260826T131200Z-yield02
          python scripts/queue_status.py escaped-by-stage

      - name: Validate queue and entry consistency
        run: python scripts/validate_repository.py

      - name: Validate project improvement knowledge
        run: |
          python scripts/process_improvement.py validate
          python scripts/measure_instruction_budget.py validate

      - name: Validate checker subagent provenance
        run: python scripts/checker_subagent_gate.py validate --merge-ready

      - name: Validate bounded entry workflow runs
        if: github.event_name != 'pull_request'
        run: python scripts/entry_workflow_guard.py validate --merge-ready

      - name: Validate changed content review path
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- | grep -Eq '^audits/targeted_corrections/.+\.json$'; then
            python scripts/targeted_correction.py validate-changed \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA"
          else
            python scripts/entry_workflow_guard.py validate-changed \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --merge-ready
            python scripts/content_audit.py validate-changed \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA"
            python scripts/semantic_resolution_gate.py validate-changed \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA"
            python scripts/source_first_audit_gate.py validate-changed \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA"
          fi

      - name: Validate all existing content audits
        if: github.event_name != 'pull_request'
        run: |
          python scripts/content_audit.py validate-audited
          python scripts/semantic_resolution_gate.py validate-audited --compat
