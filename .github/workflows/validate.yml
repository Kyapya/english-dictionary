name: Validate dictionary changes

on:
  pull_request:
    paths:
      - "entries/**/*.md"
      - "audits/**"
      - "process_improvement/**"
      - "queue/words.csv"
      - "prompts/**/*.md"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - ".github/workflows/validate.yml"
      - "AGENTS.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Repair final gate and reseal obvious blind audit
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/update-obvious-v5-20260825'
        run: |
          PYTHONPATH=. python .tmp/repair_obvious_legal_synonym.py
          mkdir -p audits/o
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from scripts import content_audit
          audit = Path('audits/o/obvious.json')
          if audit.exists():
              data = json.loads(audit.read_text(encoding='utf-8'))
              current = content_audit.body_sha256(Path('entries/o/obvious.md'))
              if data.get('body_sha256') != current:
                  audit.unlink()
          PY
          PYTHONPATH=. python .tmp/materialize_obvious_blind.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            entries/o/obvious.md \
            audits/o/obvious.json \
            audits/runs/o/obvious/cycle-001/cold_review.json \
            audits/runs/o/obvious/cycle-001/normal_review_initial.json \
            audits/runs/o/obvious/cycle-001/normal_review_post_cold.json \
            audits/runs/o/obvious/cycle-001/revision-001.md \
            audits/runs/o/obvious/cycle-001/revision-002.md \
            audits/runs/o/obvious/cycle-001/final_blind.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: add obvious legal synonym and reseal blind review"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Validate entry formats
        run: python scripts/validate_entry.py entries

      - name: Validate queue and entry consistency
        run: python scripts/validate_repository.py

      - name: Validate project improvement knowledge
        run: python scripts/process_improvement.py validate

      - name: Validate bounded entry workflow runs
        if: github.event_name != 'pull_request'
        run: python scripts/entry_workflow_guard.py validate --merge-ready

      - name: Validate changed independent content audits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/entry_workflow_guard.py validate-changed \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --merge-ready
          python scripts/content_audit.py validate-changed \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"
          python scripts/semantic_resolution_gate.py validate-changed \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"
          python scripts/source_first_audit_gate.py validate-changed \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"

      - name: Validate all existing content audits
        if: github.event_name != 'pull_request'
        run: |
          python scripts/content_audit.py validate-audited
          python scripts/semantic_resolution_gate.py validate-audited --compat
